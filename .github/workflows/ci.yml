name: RetinaGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint
        run: ruff check backend/ ml/

      - name: Run Ruff Format Check
        run: ruff format --check backend/ ml/

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-admin-password
      DATABASE_URL: sqlite+aiosqlite:///./test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./backend[dev]

      - name: Run Pytest
        run: python -m pytest backend/tests/ --tb=short

  ml-tests:
    name: ML Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ./ml[dev]

      - name: Run ML Pytest
        run: python -m pytest ml/tests/ --tb=short

  frontend-tests:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node Tests
        run: cd frontend && node --test tests/*.test.js

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit check
        run: |
          pip install pip-audit
          pip-audit --desc || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true
