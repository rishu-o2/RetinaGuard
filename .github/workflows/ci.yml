name: RetinaGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint
        run: ruff check backend/ ml/

      - name: Run Ruff Format Check
        run: ruff format --check backend/ ml/

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-admin-password
      DATABASE_URL: sqlite+aiosqlite:///./test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./backend[dev]

      - name: Run Pytest
        run: python -m pytest backend/tests/ --tb=short

  ml-tests:
    name: ML Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ./ml[dev]

      - name: Run ML Pytest
        run: python -m pytest ml/tests/ --tb=short

  frontend-tests:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm ci
          npm test

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit check
        run: |
          pip install pip-audit
          pip-audit --desc || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit npm dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true

  docker-smoke:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    # Run only on main branch pushes to save CI minutes on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      JWT_SECRET_KEY: ci-docker-test-secret-key-do-not-use
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: ci-admin-password-test
      DATABASE_URL: postgresql+asyncpg://retinaguard:retinaguard@db:5432/retinaguard_db
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ Backend healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "✗ Backend did not become healthy within 60s"
          docker compose logs backend
          exit 1

      - name: Show running containers
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
