# ==============================================================================
# RetinaGuard - Out-of-Distribution (OOD) Gate Configuration
# Standards: Hendrycks et al. (MSP), Liu et al. (Energy Score), Lee et al. (Mahalanobis)
#
# NOTE: ALL THRESHOLDS REQUIRE EMPIRICAL VALIDATION & CLINICAL REVIEW.
# ==============================================================================

version: "1.0.0"

# Optical spectral filter to detect non-fundus photos (faces, documents, outdoor scenes)
# Real human retina exhibits strong choroidal/hemoglobin red reflectance and low blue reflectance.
optical_spectrum_filter:
  enabled: true
  min_red_to_blue_ratio: 1.40          # Red must dominate over blue (fundus choroid) # NEEDS CLINICAL REVIEW
  min_red_to_green_ratio: 1.10         # Red must dominate over green # NEEDS CLINICAL REVIEW
  max_blue_mean_intensity: 120.0       # Vitreous/retina absorbs blue wavelengths heavily # NEEDS CLINICAL REVIEW
  min_retinal_luminance: 15.0          # Must contain discernible non-black tissue # NEEDS CLINICAL REVIEW

# Deep feature space OOD detection
deep_ood_metrics:
  # Maximum Softmax Probability (MSP)
  msp_min_confidence: 0.60             # Below 0.60 indicates out-of-distribution uncertainty # NEEDS CLINICAL REVIEW

  # Energy-based OOD Score: E(x; T) = -T * log(sum(exp(f_c(x)/T)))
  energy_score:
    temperature: 1.0
    threshold: -3.5                    # Higher (less negative) indicates lower density / OOD # NEEDS CLINICAL REVIEW

  # Mahalanobis Distance on penultimate feature vectors
  mahalanobis_distance:
    enabled: true
    max_distance_threshold: 45.0       # Features farther than 45 units from class centroids are OOD # NEEDS CLINICAL REVIEW
    statistics_file: "models/ood_stats_v1.npz"

failure_messages:
  OPTICAL_SPECTRUM_INVALID:
    en: "The uploaded image does not appear to be a human retinal fundus photo. Please verify the image."
    hi: "अपलोड की गई तस्वीर रेटिना (आंख के पर्दे) की नहीं लग रही है। कृपया सही तस्वीर जांचें।"
  OOD_FEATURE_DEVIATION:
    en: "Visual features deviate significantly from known retinal distributions. In-person review required."
    hi: "तस्वीर की विशेषताएं सामान्य रेटिना जांच से मेल नहीं खाती हैं। डॉक्टर द्वारा प्रत्यक्ष जांच आवश्यक है।"

