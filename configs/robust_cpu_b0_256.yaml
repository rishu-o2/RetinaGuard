# ==============================================================================
# RetinaGuard - Robust CPU Training Configuration with Camera Augmentation
# Model: EfficientNet-B0 Dual-Head, 256x256 input
# ------------------------------------------------------------------------------
# Trained on APTOS train split ONLY. Checkpoint selection strictly on VAL QWK.
# Camera-simulating augmentations active on train split.
# Out-dir: ml/runs/robust_cpu_b0_256
# ==============================================================================

model:
  backbone: "efficientnet_b0"
  num_classes: 5
  pretrained: true
  dropout_rate: 0.30
  image_size: [256, 256]

training:
  seed: 42
  epochs: 25
  batch_size: 16
  num_workers: 2                           # Capped at 2 on CPU
  use_weighted_sampler: false              # Class-weighted loss only
  mixed_precision: false                   # Disabled on CPU
  gradient_clip_val: 1.0
  early_stopping_patience: 6              # Early stopping patience on VAL QWK
  save_dir: "ml/runs/robust_cpu_b0_256"

optimizer:
  name: "AdamW"
  learning_rate: 0.0003
  weight_decay: 0.01

scheduler:
  name: "CosineAnnealingLR"
  T_max: 25                                # Matches 25 epochs
  eta_min: 0.000005

loss:
  categorical_loss: "cross_entropy"
  class_weighting: "effective_samples"
  beta: 0.999
  ordinal_loss_weight: 0.50
  focal_gamma: 2.0

logging:
  logger_type: "file"
  log_dir: "logs/training"
  project_name: "retinaguard-dr-training"
  experiment_name: "robust_cpu_b0_256"

