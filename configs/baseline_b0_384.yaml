# ==============================================================================
# RetinaGuard - Baseline Training Configuration (Colab & Fast Convergence)
# Model: EfficientNet-B0 Dual-Head (Categorical Logits + Ordinal Regression)
# ==============================================================================

model:
  backbone: "efficientnet_b0"           # timm / torchvision identifier
  num_classes: 5                        # ICDR grades 0-4
  pretrained: true                      # ImageNet initialization
  dropout_rate: 0.30
  image_size: [384, 384]                # 384x384 spatial resolution for speed & accuracy balance

training:
  seed: 42                              # Fixed seed for reproducibility
  epochs: 25
  batch_size: 32
  num_workers: 4
  use_weighted_sampler: false           # Class-weighted loss as only imbalance correction
  mixed_precision: true                 # torch.amp (AMP enabled)
  gradient_clip_val: 1.0                # Max gradient norm clipping
  early_stopping_patience: 6            # Early stopping patience based on validation QWK
  save_dir: "models/checkpoints"

optimizer:
  name: "AdamW"
  learning_rate: 0.0003
  weight_decay: 0.01

scheduler:
  name: "CosineAnnealingLR"
  T_max: 25
  eta_min: 0.000005

loss:
  categorical_loss: "cross_entropy"     # "cross_entropy" or "focal"
  class_weighting: "effective_samples"  # "effective_samples" or "inverse_frequency"
  beta: 0.999
  ordinal_loss_weight: 0.50             # Weight lambda for ordinal head
  focal_gamma: 2.0

logging:
  logger_type: "file"
  log_dir: "logs/training"
  project_name: "retinaguard-dr-training"
  experiment_name: "baseline_b0_384"

